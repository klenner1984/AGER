name: Validate AGER examples

on:
  push:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'scripts/**'
      - 'outreach/**'
      - 'config/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'scripts/**'
      - 'outreach/**'
      - 'config/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: python -m pip install --upgrade jsonschema

      - name: Validate examples
        run: python scripts/validate_examples.py

      - name: Validate tiered outreach portfolio
        run: python scripts/validate_outreach.py

      - name: Smoke-test partner pipeline routing
        run: python scripts/pipeline_next.py --top 3

      - name: Smoke-test Exposure Scan
        run: python scripts/exposure_scan.py examples/voice-agent.json --json

      - name: Smoke-test consent-first call gate
        run: python scripts/call_gate.py examples/contact-consent.json --json

      - name: Compile outreach helpers
        run: python -m py_compile scripts/privateemail_send.py scripts/privateemail_auth_test.py scripts/privateemail_inbox.py scripts/consent_from_email.py scripts/validate_outreach.py scripts/pipeline_next.py scripts/smtp_send.py

      - name: Smoke-test provider-neutral SMTP sender without network
        env:
          WOLF_SMTP_PROVIDER: brevo
          WOLF_EMAIL_PARTNER: ci@wolf-systems.invalid
        run: python scripts/smtp_send.py --profile partner --to recipient@example.invalid --subject 'CI SMTP dry-run' --body-file outreach/sample.txt --dry-run

      - name: Smoke-test PrivateEmail legacy sender without network
        env:
          WOLF_EMAIL_PARTNER: ci@wolf-systems.invalid
        run: python scripts/privateemail_send.py --profile partner --to recipient@example.invalid --subject 'CI dry-run' --body-file outreach/sample.txt --dry-run
