name: Validate AGER examples

on:
  push:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: python -m pip install --upgrade jsonschema

      - name: Validate examples
        run: python scripts/validate_examples.py

      - name: Smoke-test Exposure Scan
        run: python scripts/exposure_scan.py examples/voice-agent.json --json
